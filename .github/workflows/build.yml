name: Build JAR
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build MIDlet
        run: |
          mkdir -p lib classes out
          M=https://repo1.maven.org/maven2/org/microemu
          curl -fL -o lib/cldc.jar $M/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
          curl -fL -o lib/midp.jar $M/midpapi20/2.0.4/midpapi20-2.0.4.jar
          curl -fL -o pg.zip https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
          unzip -q pg.zip

          javac -source 1.3 -target 1.3 \
            -bootclasspath lib/cldc.jar:lib/midp.jar \
            -d classes src/ChatMidlet.java

          printf 'Manifest-Version: 1.0\nMIDlet-1: AIChat,,ChatMidlet\nMIDlet-Name: AIChat\nMIDlet-Vendor: Me\nMIDlet-Version: 1.0\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n' > manifest.txt
          jar cfm raw.jar manifest.txt -C classes .

          cat > pg.pro <<'EOF'
          -microedition
          -libraryjars lib/cldc.jar
          -libraryjars lib/midp.jar
          -injars raw.jar
          -outjars out/AIChat.jar
          -dontobfuscate
          -dontoptimize
          -dontshrink
          -dontwarn
          -keep public class ChatMidlet
          EOF
          proguard-7.4.2/bin/proguard.sh @pg.pro

      - uses: actions/upload-artifact@v4
        with:
          name: AIChat-jar
          path: out/AIChat.jar
